<section class="hero">
  <span class="decor decor--peach hero__decor-1"></span>
  <span class="decor decor--lime hero__decor-2"></span>
  <div class="hero__inner">
    <div class="hero__copy">
      <span class="badge"><span class="badge__dot"></span>Video gratuito · 7 minutos</span>
      <h1 class="hero__title">
        Conseguí más clientes <span class="text-primary">sin invertir a ciegas</span> en
        publicidad
      </h1>
      <p class="hero__subtitle">
        Descubrí cómo pensamos la captación de clientes para tu negocio con Meta Ads +
        WhatsApp. Después elegí cómo empezar.
      </p>
      <app-google-badge [inline]="true" />
      <div class="hero__actions">
        <a href="#video" class="btn btn--accent">▶ Ver el video</a>
        <a href="#escalones" class="btn btn--outline">Qué opción me conviene</a>
      </div>
    </div>
    <div id="video" class="video-card">
      <div class="video-card__shadow"></div>
      <div class="video-card__frame">
        <div class="video-card__pattern"></div>
        <div class="video-card__play"><span class="video-card__play-icon"></span></div>
        <div class="video-card__label">video embebido · 7 min</div>
      </div>
    </div>
  </div>
</section>
