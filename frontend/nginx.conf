# Máximo 5 envíos del formulario por minuto por IP.
limit_req_zone $binary_remote_addr zone=aplicaciones:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # La IP real del visitante viene de Nginx Proxy Manager (red de Docker).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    client_max_body_size 16k;

    location = /api/aplicaciones {
        limit_except POST { deny all; }
        limit_req zone=aplicaciones burst=3 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location /api/ {
        limit_except GET { deny all; }
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|webp|jpg|jpeg|png|svg|ico|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
